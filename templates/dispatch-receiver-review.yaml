# Receives a repository_dispatch event from the review-dispatch decider in
# nsheaps/agents and runs the AI code review under THIS agent's identity.
#
# Install this file in the target agent repo (nsheaps/.ai-agent-henry has it
# as `.github/workflows/repo-dispatch.yaml`). Synced via
# `nsheaps/.github` CI automation when configured.
#
# Spec: https://github.com/nsheaps/agents/blob/main/plugins/claude-code/review-utils/specs/review-dispatch.md
#       §Receiver-side-flow + §Final-CI-side-check-update
#
# Requirements (repo secrets on the agent repo):
#   - AUTOMATION_GITHUB_APP_ID / AUTOMATION_GITHUB_APP_PRIVATE_KEY
#                                    (automation App: checks on the consumer PR)
#   - REVIEW_GITHUB_APP_ID / REVIEW_GITHUB_APP_PRIVATE_KEY
#                                    (the reviewer's App, installed on the
#                                     consumer repo; posts the review)
#   - ANTHROPIC_API_KEY              (LLM auth, pick one)
#   - CLAUDE_CODE_OAUTH_TOKEN        (LLM auth, pick one)
# Exactly ONE of the two LLM-auth secrets must be set.

name: Repository Dispatch

on:
  repository_dispatch:
    # review-dispatch.yaml sends `event-type: <event_name>/<action>`. List every
    # action the per-repo gate (dispatch-review.yaml) forwards; a missing type
    # leaves the consumer's "AI Code Review" check queued forever.
    types:
      - pull_request/opened
      - pull_request/reopened
      - pull_request/synchronize
      - pull_request/ready_for_review
      - pull_request/labeled
      - pull_request/converted_to_draft

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    # @main = rolling updates. Pin to a SHA for hard stability and bump it in
    # lock-step with nsheaps/agents.
    uses: nsheaps/agents/.github/workflows/review-receiver.yaml@main
    # secrets: inherit doesn't pass cross-repo (GitHub limitation).
    secrets:
      AUTOMATION_GITHUB_APP_ID: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
      AUTOMATION_GITHUB_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
      REVIEW_GITHUB_APP_ID: ${{ secrets.REVIEW_GITHUB_APP_ID }}
      REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.REVIEW_GITHUB_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      source-repo: ${{ github.event.client_payload.source.repo }}
      source-pr-number: ${{ github.event.client_payload.source.pr_number }}
      source-head-sha: ${{ github.event.client_payload.source.head_sha }}
      source-head-ref: ${{ github.event.client_payload.source.head_ref }}
      source-base-ref: ${{ github.event.client_payload.source.base_ref }}
      check-run-id: ${{ github.event.client_payload.check_run_id }}
      consumer-workflow-run-url: ${{ github.event.client_payload.consumer_workflow_run_url }}
      trigger-event-name: ${{ github.event.client_payload.trigger.event }}
      # The receiver short-circuits on `converted_to_draft` (neutral check, no review).
      trigger-event-action: ${{ github.event.client_payload.trigger.action }}
      # plugin-ref: main  # default; pin to lock the plugin revision
